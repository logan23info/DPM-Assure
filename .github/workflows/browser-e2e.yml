name: Browser E2E

on:
  push:
    branches: [main, release-readiness-browser-e2e, release-readiness-assurance-e2e]
    paths:
      - 'src/**'
      - 'db/**'
      - 'e2e/**'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'db/**'
      - 'e2e/**'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  APP_BASE_URL: http://127.0.0.1:3000
  E2E_BASE_URL: http://127.0.0.1:3000
  OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
  OBJECT_STORE_REGION: us-east-1
  OBJECT_STORE_FORCE_PATH_STYLE: 'true'
  OBJECT_STORE_ACCESS_KEY_ID: dpm-e2e
  OBJECT_STORE_SECRET_ACCESS_KEY: ${{ github.sha }}
  OBJECT_STORE_BUCKET: dpm-e2e
  EVIDENCE_MAX_UPLOAD_BYTES: '5242880'

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dpm_assure_e2e
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dpm_assure_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start private S3-compatible evidence store
        run: |
          set -euo pipefail
          docker run -d --name dpm-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORE_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORE_SECRET_ACCESS_KEY" \
            quay.io/minio/minio server /data
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null
          node --input-type=module <<'NODE'
          import { CreateBucketCommand, S3Client } from '@aws-sdk/client-s3';
          const s3 = new S3Client({
            endpoint: process.env.OBJECT_STORE_ENDPOINT,
            region: process.env.OBJECT_STORE_REGION,
            forcePathStyle: true,
            credentials: {
              accessKeyId: process.env.OBJECT_STORE_ACCESS_KEY_ID,
              secretAccessKey: process.env.OBJECT_STORE_SECRET_ACCESS_KEY,
            },
          });
          await s3.send(new CreateBucketCommand({ Bucket: process.env.OBJECT_STORE_BUCKET }));
          NODE

      - name: Apply migrations
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: dpm_assure_e2e
          PGUSER: postgres
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Seed browser fixtures and non-owner runtime role
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: dpm_assure_e2e
          PGUSER: postgres
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO organizations(id,name,slug,status) VALUES
            ('f1000000-0000-4000-8000-000000000001','E2E Admin Organization','e2e-admin-org','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000002','E2E Other Organization','e2e-other-org','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000003','E2E Client Organization','e2e-client-org','ACTIVE');

          INSERT INTO users(id,email,display_name,status) VALUES
            ('f1000000-0000-4000-8000-000000000011','e2e-admin@example.test','E2E Admin','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000012','e2e-client@example.test','E2E Client','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000013','e2e-other@example.test','E2E Other','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000014','e2e-manager@example.test','E2E Audit Manager','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000015','e2e-reviewer@example.test','E2E Reviewer','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000016','e2e-pbc-client@example.test','E2E PBC Client','ACTIVE');

          INSERT INTO memberships(organization_id,user_id,role,status) VALUES
            ('f1000000-0000-4000-8000-000000000001','f1000000-0000-4000-8000-000000000011','ORG_ADMIN','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000003','f1000000-0000-4000-8000-000000000012','CLIENT','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000002','f1000000-0000-4000-8000-000000000013','ORG_ADMIN','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000001','f1000000-0000-4000-8000-000000000014','AUDIT_MANAGER','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000001','f1000000-0000-4000-8000-000000000015','REVIEWER','ACTIVE'),
            ('f1000000-0000-4000-8000-000000000001','f1000000-0000-4000-8000-000000000016','CLIENT','ACTIVE');

          INSERT INTO clients(id,organization_id,name,status) VALUES
            ('f2000000-0000-4000-8000-000000000001','f1000000-0000-4000-8000-000000000001','E2E Assurance Client','ACTIVE');

          INSERT INTO sources(id,source_id,authority,type,title,status,source_url,validated_by,last_validated_at,intended_use) VALUES
            ('f3000000-0000-4000-8000-000000000001','E2E-OFFICIAL-1','E2E Official Authority','OFFICIAL_STANDARD','E2E Official Privacy Requirement','ACTIVE','https://example.test/official-source','f1000000-0000-4000-8000-000000000011',now(),'Browser release verification only');
          INSERT INTO frameworks(id,framework_key,name,authority,status) VALUES
            ('f3000000-0000-4000-8000-000000000002','E2E-FRAMEWORK','E2E Source-backed Framework','E2E Official Authority','ACTIVE');
          INSERT INTO framework_versions(id,framework_id,version,status,source_id,source_url,validated_by,validated_at) VALUES
            ('f3000000-0000-4000-8000-000000000003','f3000000-0000-4000-8000-000000000002','1.0','ACTIVE','f3000000-0000-4000-8000-000000000001','https://example.test/official-source','f1000000-0000-4000-8000-000000000011',now());
          INSERT INTO requirements(id,framework_version_id,requirement_key,title,description,classification,section_reference,applicability,test_procedure,expected_evidence) VALUES
            ('f3000000-0000-4000-8000-000000000004','f3000000-0000-4000-8000-000000000003','E2E-REQ-1','Preserve evidence integrity','Evidence used for assurance must preserve provenance and integrity.','STANDARD_REQUIREMENT','E2E-1','In-scope privacy assurance activities','Inspect provenance, custody and hash.','Source artifact with verified custody and SHA-256.');
          INSERT INTO controls(id,organization_id,control_key,title,description,control_type,objective,test_procedure,expected_evidence,status) VALUES
            ('f3000000-0000-4000-8000-000000000005','f1000000-0000-4000-8000-000000000001','E2E-CTRL-1','Evidence integrity control','Preserve source-linked evidence and custody history.','AUDIT_CRITERION','Establish reliable assurance evidence.','Inspect source, custody and integrity.','Hashed source artifact.','ACTIVE');
          INSERT INTO control_requirement_mappings(control_id,requirement_id,relationship,coverage,rationale,source_reference,reviewer_id,reviewed_at,effective_at) VALUES
            ('f3000000-0000-4000-8000-000000000005','f3000000-0000-4000-8000-000000000004','IMPLEMENTS','FULL','The E2E audit criterion operationalizes the source-backed evidence-integrity requirement.','E2E-OFFICIAL-1:E2E-1','f1000000-0000-4000-8000-000000000015',now(),now());

          INSERT INTO auth_sessions(user_id,token_hash,expires_at) VALUES
            ('f1000000-0000-4000-8000-000000000011',encode(digest('e2e-admin-session-token-abcdefghijklmnopqrstuvwxyz1234567890','sha256'),'hex'),now()+interval '2 hours'),
            ('f1000000-0000-4000-8000-000000000012',encode(digest('e2e-client-session-token-abcdefghijklmnopqrstuvwxyz1234567890','sha256'),'hex'),now()+interval '2 hours'),
            ('f1000000-0000-4000-8000-000000000011',encode(digest('e2e-lifecycle-admin-session-abcdefghijklmnopqrstuvwxyz1234567890','sha256'),'hex'),now()+interval '2 hours'),
            ('f1000000-0000-4000-8000-000000000015',encode(digest('e2e-lifecycle-reviewer-session-abcdefghijklmnopqrstuvwxyz1234567890','sha256'),'hex'),now()+interval '2 hours'),
            ('f1000000-0000-4000-8000-000000000016',encode(digest('e2e-lifecycle-client-session-abcdefghijklmnopqrstuvwxyz1234567890','sha256'),'hex'),now()+interval '2 hours');

          INSERT INTO auth_login_tokens(email,token_hash,expires_at) VALUES
            ('e2e-admin@example.test',encode(digest('e2e-magic-link-token-abcdefghijklmnopqrstuvwxyz1234567890','sha256'),'hex'),now()+interval '1 hour');

          CREATE ROLE dpm_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE dpm_assure_e2e TO dpm_runtime;
          GRANT USAGE ON SCHEMA public TO dpm_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dpm_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO dpm_runtime;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO dpm_runtime;
          SQL

      - name: Build production application
        env:
          DATABASE_URL: postgresql://dpm_runtime@127.0.0.1:5432/dpm_assure_e2e
        run: npm run build

      - name: Start application with non-owner runtime role
        env:
          DATABASE_URL: postgresql://dpm_runtime@127.0.0.1:5432/dpm_assure_e2e
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/dpm-e2e.log 2>&1 &
          echo $! > /tmp/dpm-e2e.pid

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dpm-e2e.log
          exit 1

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/dpm-e2e.log || true
